# =============================================================================
# .github/workflows/accel-packages.yml
# Build Hardware Acceleration Packages (.ipk) Only
# Using immortalwrt-mt798x-6.6 as source
# =============================================================================

name: Build Hardware Acceleration Packages

on:
  workflow_dispatch:
    inputs:
      target_kernel:
        description: 'Target Kernel Version'
        required: true
        default: '6.6'
        type: choice
        options:
          - '6.6'
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'aarch64_cortex-a53'
        type: choice
        options:
          - aarch64_cortex-a53
      include_luci:
        description: 'Include LuCI plugins'
        required: false
        default: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REPO_URL: https://github.com/hnjjw2024/immortalwrt-mt798x-6.6
  REPO_BRANCH: nx30pro-nmbm-build
  CONFIG_FILE: configs/accel-packages-only.config

jobs:
  build-packages:
    name: Acceleration Packages (${{ inputs.target_kernel }}/${{ inputs.target_arch }})
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout immortalwrt-mt798x-6.6 source
        uses: actions/checkout@v4
        with:
          repository: hnjjw2024/immortalwrt-mt798x-6.6
          ref: ${{ env.REPO_BRANCH }}
          fetch-depth: 1
          path: source

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Prepare source tree
        run: |
          cd source
          echo "📂 Working directory: $(pwd)"
          ls -la package/ | head -20
          
          echo "🔍 Checking MTK packages..."
          [ -d "package/kernel/mediatek-hnat" ] && echo "✅ kmod-mediatek-hnat found" || echo "❌ kmod-mediatek-hnat not found"
          [ -d "package/kernel/warp" ] && echo "✅ kmod-warp found" || echo "❌ kmod-warp not found"

      - name: Update and install feeds
        run: |
          cd source
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load packages-only config
        run: |
          cd source
          echo "🔧 Loading configuration..."
          
          if [ -f "../${{ env.CONFIG_FILE }}" ]; then
            cp "../${{ env.CONFIG_FILE }}" .config
            echo "✅ Loaded: ${{ env.CONFIG_FILE }}"
          else
            echo "❌ Config not found"
            exit 1
          fi
          
          make defconfig
          echo "✅ Configuration applied"

      - name: Validate configuration
        run: |
          cd source
          echo "🔍 Validating packages..."
          grep -E 'CONFIG_PACKAGE_(kmod-mediatek-hnat|kmod-warp|luci-app-turboacc-mtk|mtwifi-cfg)=y' .config || true

      - name: Download sources
        run: |
          cd source
          make download -j"$(nproc)" FINDS=1 2>&1 | tee download.log

      - name: Build acceleration packages
        run: |
          cd source
          echo "🔨 Building hardware acceleration packages..."
          echo "=========================================="
          
          PACKAGES=(
            "kmod-mediatek-hnat"
            "kmod-warp"
            "kmod-ipt-offload"
            "kmod-ipt-fullconenat"
            "iptables-mod-fullconenat"
            "nftables-mod-fullconenat"
          )
          
          if [ "${{ inputs.include_luci }}" = "true" ]; then
            PACKAGES+=(
              "luci-app-turboacc-mtk"
              "luci-i18n-turboacc-mtk-zh-cn"
              "mtwifi-cfg"
              "luci-app-mtwifi-cfg"
              "luci-i18n-mtwifi-cfg-zh-cn"
            )
          fi
          
          FAILED=0
          for pkg in "${PACKAGES[@]}"; do
            echo "📦 Building: $pkg"
            if make package/$pkg/compile -j"$(nproc)" V=s 2>&1 | tee -a build.log; then
              echo "✅ $pkg built successfully"
            else
              echo "❌ $pkg build failed"
              FAILED=1
            fi
            echo "---"
          done
          
          if [ $FAILED -eq 1 ]; then
            echo "⚠️ Some packages failed"
            exit 1
          fi
          
          echo "✅ All packages built successfully"

      - name: Show generated packages
        if: always()
        run: |
          cd source
          echo "📁 Generated .ipk Packages"
          echo "=========================="
          
          find bin/packages/ -name "*.ipk" 2>/dev/null | grep -E 'hnat|warp|offload|fullcone|turboacc|mtwifi' | sort || echo "No packages found"
          
          echo -e "\n📁 Package sizes:"
          find bin/packages/ -name "*.ipk" 2>/dev/null | grep -E 'hnat|warp|offload|fullcone|turboacc|mtwifi' -exec ls -lh {} \; | sort -k5 -h || true

      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accel-packages-${{ inputs.target_kernel }}-${{ inputs.target_arch }}${{ inputs.include_luci == 'false' && '-no-luci' || '' }}
          path: |
            source/bin/packages/*/base/kmod-mediatek-hnat*.ipk
            source/bin/packages/*/base/kmod-warp*.ipk
            source/bin/packages/*/base/kmod-ipt-offload*.ipk
            source/bin/packages/*/base/kmod-ipt-fullconenat*.ipk
            source/bin/packages/*/base/iptables-mod-fullconenat*.ipk
            source/bin/packages/*/base/nftables-mod-fullconenat*.ipk
            source/bin/packages/*/luci/luci-app-turboacc-mtk*.ipk
            source/bin/packages/*/luci/luci-i18n-turboacc-mtk-zh-cn*.ipk
            source/bin/packages/*/base/mtwifi-cfg*.ipk
            source/bin/packages/*/luci/luci-app-mtwifi-cfg*.ipk
            source/bin/packages/*/luci/luci-i18n-mtwifi-cfg-zh-cn*.ipk
            source/.config
            source/build.log
          if-no-files-found: error
          retention-days: 90

      - name: Build summary
        if: always()
        run: |
          echo "📊 Build Summary"
          echo "================"
          echo "Status: ${{ job.status }}"
          echo "Kernel: ${{ inputs.target_kernel }}"
          echo "Arch: ${{ inputs.target_arch }}"
          echo "LuCI: ${{ inputs.include_luci && 'Included' || 'Excluded' }}"
          
          if [ -d "source/bin/packages" ]; then
            echo "Generated packages:"
            find source/bin/packages/ -name "*.ipk" 2>/dev/null | grep -E 'hnat|warp|offload|fullcone|turboacc|mtwifi' -exec basename {} \; | sort | uniq || echo "None"
          fi
