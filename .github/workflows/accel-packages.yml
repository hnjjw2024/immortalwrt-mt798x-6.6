# =============================================================================
# .github/workflows/accel-packages.yml
# Build Hardware Acceleration Packages (.ipk)
# Fixed: Toolchain dependencies, host tools, and YAML syntax
# =============================================================================

name: Build Hardware Acceleration Packages

on:
  workflow_dispatch:
    inputs:
      target_kernel:
        description: 'Target Kernel Version'
        required: true
        default: '6.6'
        type: choice
        options:
          - '6.6'
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'aarch64_cortex-a53'
        type: choice
        options:
          - aarch64_cortex-a53

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REPO_URL: https://github.com/hnjjw2024/immortalwrt-mt798x-6.6
  REPO_BRANCH: nx30pro-nmbm-build
  CONFIG_FILE: configs/accel-packages-only.config

jobs:
  build:
    name: Accel Packages (${{ inputs.target_kernel }}/${{ inputs.target_arch }})
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: hnjjw2024/immortalwrt-mt798x-6.6
          ref: ${{ env.REPO_BRANCH }}
          fetch-depth: 1
          path: source

      # ✅ 修复 1：补充缺失的宿主机工具 (修复 libdeflate-gzip 报错)
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev libdeflate-dev zstd liblz4-tool \
            lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch \
            pkgconf python3 python3-pip python3-ply python3-docutils python3-setuptools \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Update and install feeds
        run: |
          cd source
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load configuration
        run: |
          cd source
          echo "🔧 Loading configuration..."
          
          if [ -f "../${{ env.CONFIG_FILE }}" ]; then
            cp "../${{ env.CONFIG_FILE }}" .config
            echo "✅ Loaded: ${{ env.CONFIG_FILE }}"
          else
            echo "❌ Config not found, creating minimal config..."
            cat > .config << 'ENDOFCONFIG'
            CONFIG_TARGET_mediatek=y
            CONFIG_TARGET_mediatek_filogic=y
            CONFIG_PACKAGE_luci-app-mtwifi-cfg=y
            CONFIG_PACKAGE_luci-i18n-mtwifi-cfg-zh-cn=y
            CONFIG_PACKAGE_luci-app-turboacc-mtk=y
            CONFIG_PACKAGE_luci-i18n-turboacc-mtk-zh-cn=y
            CONFIG_PACKAGE_kmod-bonding=y
            CONFIG_PACKAGE_kmod-netlink-diag=y
            CONFIG_PACKAGE_kmod-ipt-fullconenat=y
            ENDOFCONFIG
          fi
          
          make defconfig
          echo "✅ Configuration applied"

      - name: Download sources
        run: |
          cd source
          make download -j"$(nproc)" FINDS=1 2>&1 | tee download.log

      # ✅ 修复 2：改为完整编译。OpenWrt 必须先生成 toolchain 和 kernel headers 才能打包 .ipk
      - name: Build firmware & packages
        run: |
          cd source
          echo "🔨 Building complete firmware (required for .ipk generation)..."
          echo "⏱️ Estimated time: 60-90 minutes on GitHub Actions"
          
          # 使用完整编译确保 toolchain 和依赖完整生成
          make -j"$(nproc)" V=s 2>&1 | tee build.log
          
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ Build completed successfully!"
          else
            echo "❌ Build failed. Check build.log for details."
            exit 1
          fi

      - name: Show generated packages
        if: always()
        run: |
          cd source
          echo "📁 Generated .ipk Packages"
          echo "=========================="
          find bin/packages/ -name "*.ipk" 2>/dev/null | grep -E 'hnat|warp|offload|fullcone|turboacc|mtwifi' | sort || echo "No packages found"

      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accel-packages-${{ inputs.target_kernel }}-${{ inputs.target_arch }}
          path: |
            source/bin/packages/*/base/kmod-mediatek-hnat*.ipk
            source/bin/packages/*/base/kmod-warp*.ipk
            source/bin/packages/*/base/kmod-ipt-offload*.ipk
            source/bin/packages/*/base/kmod-ipt-fullconenat*.ipk
            source/bin/packages/*/base/iptables-mod-fullconenat*.ipk
            source/bin/packages/*/base/nftables-mod-fullconenat*.ipk
            source/bin/packages/*/base/mtwifi-cfg*.ipk
            source/bin/packages/*/luci/luci-app-turboacc-mtk*.ipk
            source/bin/packages/*/luci/luci-i18n-turboacc-mtk-zh-cn*.ipk
            source/bin/packages/*/luci/luci-app-mtwifi-cfg*.ipk
            source/bin/packages/*/luci/luci-i18n-mtwifi-cfg-zh-cn*.ipk
            source/.config
            source/build.log
          if-no-files-found: warn
          retention-days: 90

      - name: Build summary
        if: always()
        run: |
          echo "📊 Build Summary"
          echo "================"
          echo "Status: ${{ job.status }}"
          echo "Kernel: ${{ inputs.target_kernel }}"
          echo "Arch: ${{ inputs.target_arch }}"